{% extends "base.html" %}

{% block content %}
<div style="padding: 8rem 5% 4rem; max-width: 1400px; margin: 0 auto; min-height: 80vh;">
    <div class="section-header">
        <h2>Our Collections</h2>
        <p style="color: var(--secondary); margin-top: 1rem;">Curated aesthetics for every occasion.</p>
    </div>

    <div class="category-grid">
        {% for category in categories %}
        <div class="category-card">
            <img src="{{ url_for('static', filename=category.image) }}" alt="{{ category.name }}">
            <div class="category-overlay">
                <h3>{{ category.name }}</h3>
                <a href="{{ url_for('shop') }}" class="shop-link">Shop Collection &rarr;</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
